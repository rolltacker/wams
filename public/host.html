<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host · Nightmare Before Deployment</title><link rel="stylesheet" href="/style.css"></head><body><main class="wide"><header><div class="eyebrow">☠ GAME MASTER ☠</div><h1>The Nightmare <em>Before Deployment</em></h1><p class="tag">Host console · share this screen in Teams</p></header><section id="login" class="panel"><h2>Host login</h2><input type="password" id="password" placeholder="Host password"><button id="signin">Unlock controls</button><p id="error" class="error"></p></section><section id="game" hidden><div class="hostbar"><button id="next">Start Game</button><button id="reveal" class="alt">Reveal Answer</button><button id="reset" class="alt">Reset Scores</button><button id="clear" class="danger">Clear Players</button></div><div class="status"><span id="round"></span><span id="progress"></span></div><div class="panel"><div id="timer" class="timer"></div><h2 id="question"></h2><div id="choices" class="choices"></div><p id="message"></p></div><div class="panel"><h2>🏆 Live leaderboard <small id="count"></small></h2><div id="board"></div></div><div class="panel"><h3>Player join link</h3><div id="joinurl"></div></div></section><footer>Where every wrong answer is a critical incident.</footer></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
